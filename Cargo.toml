[package]
name = "rtc-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
description = "Pure-Rust PeerConnection-equivalent WebRTC orchestration for native macOS meeting clients, layered on the doomfish media stack (sdp/ice/dtls/srtp/rtp/opus)"
authors = ["Per Johansson <per@doom.fish>"]
homepage = "https://github.com/doom-fish/rtc-rs"
repository = "https://github.com/doom-fish/rtc-rs"
keywords = ["webrtc", "peerconnection", "rtp", "dtls-srtp", "ice"]
categories = ["network-programming", "multimedia"]
readme = "README.md"
build = "build.rs"
publish = false

[lib]
name = "rtc"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
# Compiles the sibling Apple-SDK bindings; no capture, encode, decode or render
# sources are implemented yet. Off by default. See COVERAGE.md.
apple-media = [
    "dep:avcapture",
    "dep:audiounit",
    "dep:videotoolbox",
    "dep:audiotoolbox",
    "dep:apple-metal",
    "dep:coreanimation",
]

[dependencies]
zeroize = ">=1.6, <1.9"

sdp = { path = "../sdp-rs", package = "sdp-rs", version = ">=0.2, <0.3" }
ice = { path = "../ice-rs", package = "ice-rs", version = ">=0.2, <0.3" }
dtls = { path = "../dtls-rs", package = "dtls-rs", version = ">=0.2, <0.3" }
srtp = { path = "../srtp-rs", package = "srtp-rs", version = ">=0.2, <0.3" }
rtp = { path = "../rtp-rs", package = "rtp-rs", version = ">=0.2, <0.3" }
opus = { path = "../opus-rs", package = "opus-rs", version = ">=0.2, <0.3" }
stun = { path = "../stun-rs", package = "stun-rs", version = ">=0.2, <0.3" }
turn = { path = "../turn-rs", package = "turn-rs", version = ">=0.2, <0.3" }

# Native media plane (optional, behind the `apple-media` feature).
avcapture = { path = "../avcapture-rs", package = "avcapture", version = ">=0.7, <0.8", optional = true }
audiounit = { path = "../audiounit-rs", package = "audiounit", version = ">=0.4, <0.5", optional = true }
videotoolbox = { path = "../videotoolbox-rs", package = "videotoolbox", version = ">=0.21, <0.22", optional = true }
audiotoolbox = { path = "../audiotoolbox-rs", package = "audiotoolbox", version = ">=0.5, <0.6", optional = true }
apple-metal = { path = "../apple-metal-rs", package = "apple-metal", version = ">=0.10, <0.11", optional = true }
coreanimation = { path = "../coreanimation-rs", package = "coreanimation-rs", version = ">=0.6, <0.7", optional = true }

[[example]]
name = "01_offer_answer_local"
path = "examples/01_offer_answer_local.rs"

[[example]]
name = "02_loopback"
path = "examples/02_loopback.rs"

[[example]]
name = "03_silence_call"
path = "examples/03_silence_call.rs"

[dev-dependencies]
rtp = { path = "../rtp-rs", package = "rtp-rs" }
